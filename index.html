<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hero Tower Defense</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0e27}
body{color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
.sc{display:none;padding:14px}.sc.on{display:block}
h1{font-size:30px;text-align:center;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
h3{font-size:14px;margin-bottom:6px}
.bar,.top{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:15px}
b{color:#f1c40f}
.pn{background:#151a3a;border:2px solid #2a3a6a;border-radius:10px;padding:12px;margin:0 auto 10px;max-width:920px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:920px;margin:0 auto 10px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;max-height:300px;overflow-y:auto}
.card{background:#0a0e27;border:2px solid #2a3a6a;border-radius:8px;padding:6px;cursor:pointer;font-size:11px}
.card.dim{opacity:.5;border-style:dashed}
button{background:linear-gradient(#3498db,#2980b9);color:#fff;border:0;padding:8px 16px;font-weight:bold;border-radius:8px;cursor:pointer;margin:3px}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:linear-gradient(#2ecc71,#27ae60)}button.r{background:linear-gradient(#e74c3c,#c0392b)}button.y{background:linear-gradient(#f39c12,#d68910)}
#rates{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;margin-bottom:6px}

#cv{display:block;width:100%;max-width:900px;margin:0 auto;background:#111;border:2px solid #2a3a6a;border-radius:8px;cursor:pointer}

.box{background:#151a3a;border:2px solid #2a3a6a;border-radius:12px;padding:26px;text-align:center}

.row{display:flex;justify-content:space-between;margin:3px 0;font-size:12px}
.gw{display:flex;gap:8px;align-items:flex-start;max-width:1100px;margin:0 auto}
#cw{position:relative;flex:1;min-width:0}
#mb{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;padding:0;margin:0;font-size:18px;background:rgba(52,152,219,.85);border:2px solid #fff}
#pop{display:none;position:absolute;width:160px;background:rgba(21,26,58,.96);border:2px solid #f1c40f;border-radius:8px;padding:7px;font-size:11px;z-index:5}
#pop button{width:100%;margin:3px 0 0;padding:4px;font-size:11px}
.mr{display:flex;justify-content:space-between;border-left:3px solid;padding:1px 4px;background:#0a0e27;margin:2px 0;font-size:10px}
#hand{width:104px;display:flex;flex-direction:column;gap:4px;max-height:560px;overflow-y:auto}
.hc{display:grid;grid-template-columns:auto 1fr;gap:2px 4px;align-items:center;background:#0a0e27;border:2px solid;border-radius:6px;padding:3px 4px;font-size:9px;cursor:pointer;position:relative}
.hc>span{font-size:16px}.hc i{position:absolute;top:1px;right:3px;font-style:normal;color:#f1c40f}.hc.dim{opacity:.4}.hc.sel{background:#1a2050}
.tg{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#0a0e27;padding:10px;border-radius:8px;margin:8px 0;text-align:left;font-size:14px}
.tg small{color:#888}.tg input{width:22px;height:22px}
</style></head><body>
<div id="toast"></div>
<div id="menu" class="sc on">
<h1>⚔️ HERO TOWER DEFENSE ⚔️</h1>
<div class="bar">💎 <b id="mg"></b> 🪙 <b id="mc"></b> <span id="mt"></span></div>
<div class="pn"><h3>🔮 Summon</h3><div id="rates"></div><button id="s1" class="y">Summon (100 💎)</button><button id="s10" class="y">Summon 10x (1000 💎)</button></div>
<div class="two"><div class="pn"><h3>🎒 Inventori (klik = masuk loadout)</h3><div id="inv" class="grid"></div></div>
<div class="pn"><h3>⚔️ Loadout <span id="ls" style="float:right;color:#f1c40f"></span></h3><div id="lo" class="grid"></div></div></div>
<div class="pn"><h3>📍 Pilih Stage</h3><div id="maps"></div><div id="acts" class="grid" style="margin:8px 0"></div><div id="sel" style="color:#aaa;font-size:13px"></div>
<button id="play" class="g" style="font-size:17px;padding:12px 30px">▶ MULAI</button><button id="evb" class="y">🧬 Evolve</button><button id="set">⚙️ Settings</button><button id="rst" class="r">Reset Progress</button></div>
</div>
<div id="game" class="sc">
<div class="top"><span>🪙 <b id="gc"></b></span><span>🏰 <b id="gl"></b>/100</span><span>🌊 <b id="gw"></b>/20</span><span id="gn" style="color:#f1c40f"></span><button id="sw">▶ Wave</button><button id="sk" class="y" style="display:none">⏩ Skip</button></div>
<div class="gw"><div id="cw"><canvas id="cv" width="900" height="550"></canvas><button id="mb">⚙️</button><div id="pop"></div></div><div id="hand"></div></div>
</div>
<div id="ov"><div class="box" id="ob"></div></div>
<script>
const BASE=100,DMG=10,MAXW=20,$=i=>document.getElementById(i);
const R={common:{n:'Common',c:'#b0b0b0',p:.5,d:1,r:1,s:1,k:1},rare:{n:'Rare',c:'#4a90e2',p:.25,d:1.35,r:1.1,s:1.1,k:1.3},epic:{n:'Epic',c:'#9b59b6',p:.15,d:1.8,r:1.2,s:1.2,k:1.7},legendary:{n:'Legendary',c:'#f39c12',p:.075,d:2.5,r:1.35,s:1.3,k:2.3},mythic:{n:'Mythic',c:'#e74c3c',p:.024,d:3.5,r:1.5,s:1.45,k:3.2},td:{n:'TD',c:'#00ffff',p:.001,d:5.5,r:1.75,s:1.65,k:4.5}};
const ORD=['td','mythic','legendary','epic','rare','common'];
const COST={common:40,rare:70,epic:110,legendary:170,mythic:300,td:600};
const MAXD={common:8,rare:6,epic:5,legendary:4,mythic:3,td:2},MAXL={common:10,rare:12,epic:15,legendary:18,mythic:20,td:25};
const POOL={
common:[['archer','Archer','🏹',8,90,.7,'single'],['swordsman','Swordsman','⚔️',12,60,.9,'single'],['shieldman','Shieldman','🛡️',6,55,1.2,'slow'],['hunter','Hunter','🎯',9,110,.85,'single']],
rare:[['ice_mage','Ice Mage','❄️',9,110,.9,'slow'],['knight','Knight','🗡️',18,70,1,'single'],['wind_mage','Wind Mage','🌪️',10,120,.7,'chain'],['cleric','Cleric','⛪',6,90,1.2,'economy'],['berserker','Berserker','🪓',22,65,1.1,'crit']],
epic:[['fire_wizard','Fire Wizard','🔥',15,100,1.2,'aoe'],['assassin','Assassin','🔪',30,80,1.5,'crit'],['gold_miner','Gold Miner','⛏️',5,80,2,'economy'],['thunder_mage','Thunder Mage','⚡',14,115,1.1,'chain']],
legendary:[['dragon_kn','Dragon Knight','🐉',25,110,.9,'aoe'],['storm_cal','Storm Caller','🌩️',20,130,1.1,'chain'],['shadow_bl','Shadow Blade','🌑',35,95,1,'crit'],['ice_queen','Ice Queen','👑',18,130,1,'slow']],
mythic:[['void_reaper','Void Reaper','👁️',35,120,.8,'chain'],['celestial_g','Celestial Guardian','✨',30,140,1,'aoe'],['phantom_lord','Phantom Lord','👻',40,110,.9,'crit'],['chronomancer','Chronomancer','⏳',32,145,.9,'slow']],
td:[['void_emperor','Void Emperor','🕳️',65,160,.6,'chain'],['celestial_avatar','Celestial Avatar','🌟',58,180,.8,'aoe'],['phantom_god','Phantom God','💀',75,140,.7,'crit'],['time_lord','Time Lord','⏰',60,175,.75,'slow']]};
const DEF={};for(const r in POOL)for(const a of POOL[r])DEF[a[0]]={id:a[0],name:a[1],icon:a[2],dmg:a[3],rng:a[4],cd:a[5],skill:a[6],rar:r};
const ULT={chain:{n:'☄️ VOID STORM',c:'#cc66ff',m:4},aoe:{n:'🔥 SUPERNOVA',c:'#ff8800',m:5},crit:{n:'⚔️ ARMAGEDDON',c:'#ff2255',m:6},slow:{n:'⏰ TIME STOP',c:'#66ccff',m:2}};
const ET={normal:{hp:30,sp:55,rw:25,c:'#e74c3c',r:10},fast:{hp:20,sp:95,rw:20,c:'#f1c40f',r:8},tank:{hp:100,sp:35,rw:45,c:'#9b59b6',r:14},flying:{hp:40,sp:80,rw:30,c:'#1abc9c',r:9},boss:{hp:500,sp:30,rw:400,c:'#c0392b',r:22}};
const WP=[{x:0,y:275},{x:220,y:275},{x:220,y:90},{x:520,y:90},{x:520,y:460},{x:900,y:460}];
const MAPS=[{n:'🌲 Forest',d:[.7,.85,1,1.2,1.4,1.65,2]},{n:'🏜️ Desert',d:[2.2,2.5,2.8,3.1,3.5,3.9,4.5]},{n:'🌋 Volcano',d:[5,5.5,6,6.5,7.2,8,9]}];
let S={gems:500,coins:0,inv:[],load:[],clr:{},nid:1,mi:0,ri:0,mode:'c',mats:{},auto:false,fx:true,stage:null},G=null;
const cv=$('cv'),ctx=cv.getContext('2d');
function save(){try{localStorage.setItem('td2',JSON.stringify({gems:S.gems,coins:S.coins,inv:S.inv,load:S.load,clr:S.clr,nid:S.nid,mats:S.mats,auto:S.auto,fx:S.fx}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('td2'));if(d)Object.assign(S,d)}catch(e){}
if(!S.inv.length)for(const id of['archer','swordsman','hunter'])S.inv.push({iid:S.nid++,id,rar:'common',lv:1});
S.inv.forEach(u=>u.lv=1);S.load=S.load.filter(i=>S.inv.some(u=>u.iid===i));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function show(n){document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));$(n).classList.add('on')}
function stats(u){const d=DEF[u.id],r=R[u.rar];return{dmg:Math.floor(d.dmg*r.d*(1+(u.lv-1)*.18)),rng:Math.floor(d.rng*r.r*(1+(u.lv-1)*.06)),cd:d.cd/(r.s*(1+(u.lv-1)*.04)),skill:d.skill}}
const upCost=u=>Math.floor(COST[u.rar]*1.3*R[u.rar].k*Math.pow(1.7,u.lv-1));
const SKM={single:1,slow:1.1,crit:1.15,aoe:1.25,chain:1.3,economy:1.4};
const placeCost=u=>Math.round(COST[u.rar]*SKM[DEF[u.id].skill]/5)*5;
const RECIPES={void_reaper:{r:'void_emperor',m:{void_shard:5,void_core:2}},celestial_g:{r:'celestial_avatar',m:{celestial_tear:5,star_fragment:2}},phantom_lord:{r:'phantom_god',m:{phantom_essence:5,death_crystal:2}},chronomancer:{r:'time_lord',m:{phantom_essence:5,star_fragment:2}}};
const MATS={void_shard:['Void Shard','🔷'],celestial_tear:['Celestial Tear','💧'],phantom_essence:['Phantom Essence','🌀'],void_core:['Void Core','⚫'],star_fragment:['Star Fragment','⭐'],death_crystal:['Death Crystal','💎']};
const REALMS=[{n:'🕳️ Void Realm',m:'void_shard',d:[[3,1],[4.5,2],[6.5,3]]},{n:'✨ Celestial Realm',m:'celestial_tear',d:[[3.2,1],[4.8,2],[7,3]]},{n:'👻 Phantom Realm',m:'phantom_essence',d:[[3.5,1],[5,2],[7.5,3]]},{n:'⚫ Void Core',m:'void_core',d:[[5.5,1],[7.5,1],[10,2]]},{n:'⭐ Star Realm',m:'star_fragment',d:[[5.8,1],[7.8,1],[10.5,2]]},{n:'💀 Death Realm',m:'death_crystal',d:[[6,1],[8,1],[11,2]]}];
const RLIM={dps:5,sniper:3,aoe:3,chain:3,crit:3,cc:3,economy:2};
const ROLE={dps:['⚔️ DPS','#e74c3c'],sniper:['🎯 Sniper','#2ecc71'],aoe:['💣 AOE','#f39c12'],chain:['⛓️ Chain','#9b59b6'],crit:['⚡ Crit','#f1c40f'],cc:['❄️ CC','#66ccff'],economy:['💰 Eco','#f1c40f']};
const role=d=>d.skill==='single'?(d.rng>=110?'sniper':'dps'):d.skill==='slow'?'cc':d.skill;
const maxDep=u=>Math.min(RLIM[role(DEF[u.id])],MAXD[u.rar]);
const isHi=u=>u.rar==='mythic'||u.rar==='td';
/* ===== MENU ===== */
function card(u,fn,x){const d=DEF[u.id],r=R[u.rar],s=stats(u),e=document.createElement('div');e.className='card';e.style.borderColor=r.c;
e.innerHTML=`<div style="font-size:20px">${d.icon}</div><b style="color:#fff">${d.name}</b><div style="color:${r.c};font-size:10px">${r.n} · ${ROLE[role(d)][0]}</div><div style="color:#f1c40f;font-size:10px">Max ${maxDep(u)} · 🪙${placeCost(u)}</div><div style="font-size:10px;color:#aaa">DMG ${s.dmg} · RNG ${s.rng}</div>`;e.onclick=fn;return e}
function updMenu(){
$('mg').textContent=S.gems;$('mc').textContent=Math.floor(S.coins);$('mt').innerHTML=Object.keys(MATS).filter(k=>S.mats[k]).map(k=>`<span style="border:1px solid #2a3a6a;border-radius:10px;padding:2px 7px;font-size:12px">${MATS[k][1]} ${S.mats[k]}</span>`).join(' ');$('s1').disabled=S.gems<100;$('s10').disabled=S.gems<1000;$('ls').textContent=S.load.length+'/5';
const iv=$('inv');iv.innerHTML='';[...S.inv].sort((a,b)=>ORD.indexOf(a.rar)-ORD.indexOf(b.rar)).forEach(u=>{const c=card(u,()=>tgl(u.iid));if(S.load.includes(u.iid))c.classList.add('dim');iv.appendChild(c)});
const lo=$('lo');lo.innerHTML='';S.load.forEach(id=>{const u=S.inv.find(x=>x.iid===id);if(u)lo.appendChild(card(u,()=>tgl(id)))});
$('play').disabled=!S.stage||!S.load.length;renderStage()}
function tgl(id){const i=S.load.indexOf(id);if(i>=0)S.load.splice(i,1);else{if(S.load.length>=5)return toast('Maks 5 unit!');S.load.push(id)}updMenu();save()}
function renderStage(){const m=$('maps');m.innerHTML='';
const mk=(t,on,f)=>{const b=document.createElement('button');b.textContent=t;if(on)b.className='g';b.onclick=f;m.appendChild(b)};
mk('🗺️ Campaign',S.mode!=='l',()=>{S.mode='c';S.stage=null;updMenu()});mk('⚔️ Legend (bahan evolve)',S.mode==='l',()=>{S.mode='l';S.stage=null;updMenu()});
m.appendChild(document.createElement('br'));
const L=S.mode==='l',list=L?REALMS:MAPS;
list.forEach((mp,i)=>mk(mp.n,i===(L?S.ri:S.mi),()=>{if(L)S.ri=i;else S.mi=i;renderStage()}));
const a=$('acts');a.innerHTML='';
(L?REALMS[S.ri].d:MAPS[S.mi].d).forEach((df,j)=>{const dv=L?df[0]:df,k=(L?'L'+S.ri:S.mi)+'_'+j,c=S.clr[k]||0,e=document.createElement('div');e.className='card';
e.innerHTML=`<b style="color:#fff">${L?'Level '+(j+1):'Act '+(j+1)+(j===6?' 👑':'')}</b><div style="font-size:10px;color:#aaa">Diff x${dv}<br>${L?MATS[REALMS[S.ri].m][1]+' x'+df[1]+'<br>':''}${c?'✅ '+c+'x':'baru (150 💎)'}</div>`;
if(S.stage&&S.stage.k===k)e.style.borderColor='#f1c40f';
e.onclick=()=>{const nm=L?`${REALMS[S.ri].n} - Lv ${j+1}`:`${MAPS[S.mi].n} - Act ${j+1}${j===6?' (BOSS)':''}`;S.stage={k,n:nm,diff:dv,boss:!L&&j===6,mat:L?REALMS[S.ri].m:null,drop:L?df[1]:0};updMenu()};a.appendChild(e)});
$('sel').textContent=S.stage?'Dipilih: '+S.stage.n:'Belum ada stage dipilih.'}
function summon(n){if(S.gems<100*n)return;S.gems-=100*n;const got=[];
for(let i=0;i<n;i++){let x=Math.random(),a=0,r='common';for(const k of['common','rare','epic','legendary','mythic','td']){a+=R[k].p;if(x<a){r=k;break}}
const p=POOL[r],d=p[Math.floor(Math.random()*p.length)];const u={iid:S.nid++,id:d[0],rar:r,lv:1};S.inv.push(u);got.push(u)}
got.sort((a,b)=>ORD.indexOf(a.rar)-ORD.indexOf(b.rar));toast(`${DEF[got[0].id].icon} ${DEF[got[0].id].name} (${R[got[0].rar].n})!`);updMenu();save()}
$('rates').innerHTML=Object.values(R).map(r=>`<span style="color:${r.c}">${r.n} ${(r.p*100).toFixed(1)}%</span>`).join('');
$('s1').onclick=()=>summon(1);$('s10').onclick=()=>summon(10);
$('rst').onclick=()=>{if(confirm('Reset semua progress?')){try{localStorage.removeItem('td2')}catch(e){}location.reload()}};
/* ===== FX ===== */
const ring=(x,y,r,c,l=.6,w=4)=>G.fx.push({t:'ring',x,y,r,c,l,m:l,w});
const nova=(x,y,r,c,l=.5)=>G.fx.push({t:'nova',x,y,r,c,l,m:l});
const slash=(x,y,c)=>G.fx.push({t:'slash',x,y,c,l:.3,m:.3,a:Math.random()*Math.PI});
const ftext=(x,y,s,c,l=.8)=>G.fx.push({t:'text',x,y,s,c,l,m:l});
function parts(x,y,c,n,sp,l){if(!S.fx)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.5+Math.random());G.par.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:l*(.7+Math.random()*.6),m:l,c,z:2+Math.random()*3})}}
function shake(i,d){if(!S.fx)return;G.sk=Math.max(G.sk,i);G.shake=Math.max(G.shake,d)}
function flash(c,d){if(!S.fx)return;G.fc=c;G.flash=d}
function beam(a,b,c,w=2){G.bm.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y,c,w,l:.15,m:.15})}
function bolt(a,b,c,w=3){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,n=Math.max(3,Math.floor(L/18)),nx=-dy/L,ny=dx/L,pts=[{x:a.x,y:a.y}];
for(let i=1;i<n;i++){const t=i/n,o=(Math.random()-.5)*22;pts.push({x:a.x+dx*t+nx*o,y:a.y+dy*t+ny*o})}pts.push({x:b.x,y:b.y});G.bm.push({pts,c,w:w+1,l:.22,m:.22})}
function ultFX(u,c,r,title){G.dim=.9;ring(u.x,u.y,r*1.3,'#fff',.9,3);for(const e of G.en.slice(0,12)){if(e.dead)continue;bolt({x:e.x+(Math.random()-.5)*40,y:-10},e,c,5);nova(e.x,e.y,45,c,.4)}for(let i=0;i<4;i++)setTimeout(()=>{if(G)ring(u.x,u.y,r*(.5+i*.17),c,.7+i*.12,6-i)},i*110);
nova(u.x,u.y,r,c,.8);parts(u.x,u.y,c,70,380,1.4);parts(u.x,u.y,'#fff',30,260,1.1);G.fx.push({t:'banner',s:title,c,l:1.6,m:1.6});shake(22,.7);flash(c,.45)}
const TH={void_reaper:'#a040ff',void_emperor:'#c060ff',celestial_g:'#ffd84a',celestial_avatar:'#fff08a',phantom_lord:'#ff3ccf',phantom_god:'#ff6fe0',chronomancer:'#3fe0ff',time_lord:'#9ff0ff'};
const tc=u=>TH[u.i.id]||R[u.i.rar].c;
function trail(a,b,c){if(!S.fx)return;for(let i=1;i<9;i++){const k=i/9;G.par.push({x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,l:.35,m:.35,c,z:3})}}
function sigil(u,c){const t=performance.now()/1000,td=u.i.rar==='td',n=td?6:5;
ctx.save();ctx.translate(u.x,u.y+6);ctx.scale(1,.55);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=c;ctx.shadowColor=c;ctx.shadowBlur=10;ctx.globalAlpha=.8;ctx.lineWidth=2;
