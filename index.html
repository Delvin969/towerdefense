let h='<h2 style="margin-bottom:8px">🧬 Evolve</h2><div style="max-height:60vh;overflow-y:auto;width:min(420px,84vw)">';
if(!list.length)h+='<p style="color:#888;font-size:13px">Belum ada unit Mythic yang bisa di-evolve.<br>Summon Mythic lalu kumpulkan bahan di Legend Stage.</p>';
for(const u of list){const rc=RECIPES[u.id];let can=true,rows='';
for(const k in rc.m){const hv=S.mats[k]||0,ok=hv>=rc.m[k];if(!ok)can=false;rows+=`<div class="mr" style="border-color:${ok?'#2ecc71':'#e74c3c'}"><span>${MATS[k][1]} ${MATS[k][0]}</span><span>${hv}/${rc.m[k]}</span></div>`}
h+=`<div class="card" style="cursor:default;text-align:left;margin:6px 0;border-color:${R.mythic.c}">${DEF[u.id].icon} <b style="color:#fff">${DEF[u.id].name}</b> → ${DEF[rc.r].icon} <b style="color:#0ff">${DEF[rc.r].name}</b>${rows}<button class="y evgo" data-i="${u.iid}" style="width:100%;margin:4px 0 0" ${can?'':'disabled'}>Evolve</button></div>`}
$('ob').innerHTML=h+'</div><button id="evx" class="r" style="margin-top:8px">Tutup</button>';
$('evx').onclick=()=>{$('ov').style.display='none'};
document.querySelectorAll('.evgo').forEach(b=>b.onclick=()=>{const u=S.inv.find(x=>x.iid==b.dataset.i),rc=RECIPES[u.id];if(!rc)return;
for(const k in rc.m)if((S.mats[k]||0)<rc.m[k])return toast('❌ Bahan kurang!');
for(const k in rc.m)S.mats[k]-=rc.m[k];
const oldName=DEF[u.id].name;u.id=rc.r;u.rar='td';u.lv=1;
const es=EVO_SKILL[u.id];save();updMenu();
$('ov').style.display='flex';
$('ob').innerHTML=`<h2 style="color:#0ff;text-shadow:0 0 20px #0ff">🌟 EVOLVED!</h2>
<p style="color:#aaa;margin:6px 0">${oldName} → <b style="color:#0ff">${DEF[u.id].name}</b></p>
<div style="background:#0a0e27;border:2px solid ${es.color};border-radius:8px;padding:12px;margin:10px 0">
<div style="font-size:28px">${es.icon}</div>
<b style="color:${es.color};font-size:16px">${es.name}</b>
<div style="font-size:11px;color:#aaa;margin-top:4px">${es.desc}</div>
<div style="font-size:12px;color:#f1c40f;margin-top:8px">Ultimate: ${es.ult}</div></div>
<button id="evx" class="g">OK</button>`;
$('evx').onclick=()=>{$('ov').style.display='none';evMenu()};
toast('🌟 '+DEF[u.id].name+' — Skill baru: '+es.name)})}
function traitMenu(){
$('ov').style.display='flex';
const sums={common:0,legendary:0,mythic:0};
Object.values(TRAITS).forEach(t=>sums[t.rar]+=t.chance);
let h=`<h2 style="margin-bottom:6px">🎲 Traits</h2>
<p style="color:#888;font-size:11px;margin-bottom:4px">Trait hanya menambah CD/DMG/Range</p>
<div style="background:#0a0e27;border:1px solid #2a3a6a;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between">
<span style="color:#aaa">🎲 Token</span><b style="color:#f1c40f">${S.rr||0}</b></div>
<p style="color:#666;font-size:10px;margin-bottom:6px">Reroll hanya pakai 🎲 token (1 token = 1 reroll). Dapatkan token dari kode redeem.</p>
<div style="max-height:55vh;overflow-y:auto;width:min(460px,88vw)">`;
if(!S.inv.length)h+='<p style="color:#888">Belum ada unit.</p>';
const sorted=[...S.inv].sort((a,b)=>ORD.indexOf(a.rar)-ORD.indexOf(b.rar));
for(const u of sorted){const d=DEF[u.id],r=R[u.rar],tr=getTrait(u);if(!tr)continue;
const tl=tr.tier!==undefined&&TRAITS[tr.id]&&TRAITS[tr.id].tiers.length>1?[' I',' II',' III'][tr.tier]:'';
const rc=RAR_COLOR_TRAIT[tr.rar]||'#888';
h+=`<div class="card" style="cursor:default;text-align:left;margin:5px 0;border-color:${r.c};display:flex;justify-content:space-between;align-items:center;gap:8px">
<div style="flex:1;min-width:0">
<div><b style="color:#fff">${d.icon} ${d.name}</b> <span style="color:${r.c};font-size:10px">${r.n}</span></div>
<div style="color:${tr.c};font-size:12px;margin-top:3px">${tr.i} <b>${tr.n}${tl}</b> <span style="color:${rc};font-size:9px">[${tr.rar}]</span></div>
<div style="color:#aaa;font-size:10px">${tr.f?tr.f(tr):''}</div></div>
<button class="y rr" data-i="${u.iid}" style="margin:0;padding:6px 10px;font-size:12px;flex-shrink:0" ${((S.rr||0)<=0)?'disabled':''}>🎲 Reroll (${S.rr||0})</button>
</div>`}
h+=`<div style="border-top:1px solid #2a3a6a;margin-top:10px;padding-top:8px;font-size:10px;color:#888;line-height:1.7">
<b style="color:#f1c40f">📖 Chance Trait (per roll):</b><br>
💪 Vigor 26% · 💨 Swift 26% · 🎯 Range 26% <span style="color:#666">(Common, 3 tier)</span><br>
🏹 Marksman 6.5% · ⚡ Blitz 1.85% <span style="color:#666">(Legendary)</span><br>
☀️ Solar 0.5% · 🎯 Deadeye 0.375% · 👻 Ethereal 0.175% · 👑 Monarch 0.1%<br>
<b style="color:#f1c40f">🎲 Token saat ini: ${S.rr||0}</b></div>`;
$('ob').innerHTML=h+'</div><button id="trx" class="r" style="margin-top:8px">Tutup</button>';
$('trx').onclick=()=>{$('ov').style.display='none';updMenu()};
document.querySelectorAll('.rr').forEach(b=>b.onclick=()=>{
if((S.rr||0)<=0)return toast('❌ Token 🎲 habis! Butuh token untuk reroll.');
const u=S.inv.find(x=>x.iid==b.dataset.i);if(!u)return;
u.trait=rndTrait();
S.rr--;
const tr=getTrait(u);
const tl=tr.tier!==undefined&&TRAITS[tr.id]&&TRAITS[tr.id].tiers.length>1?[' I',' II',' III'][tr.tier]:'';
save();
setTimeout(()=>toast(`${tr.i} Reroll → ${tr.n}${tl}! Sisa 🎲 ${S.rr}`),300);
traitMenu();updMenu()})}
$('evb').onclick=evMenu;
$('trb').onclick=traitMenu;
$('rdb').onclick=redeemMenu;
$('mb').onclick=()=>pmenu(true);$('set').onclick=()=>pmenu(false);
$('play').onclick=startStage;
/* ===== DRAW ===== */
function draw(){ctx.save();
if(G.shake>0){const s=G.sk*Math.min(1,G.shake);ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s)}else G.sk=0;
ctx.fillStyle='#111';ctx.fillRect(-30,-30,960,610);ctx.strokeStyle='rgba(50,60,100,.25)';ctx.lineWidth=1;
for(let x=0;x<900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,550);ctx.stroke()}
for(let y=0;y<550;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}
ctx.lineCap='round';ctx.lineJoin='round';
for(const[c,w]of[['#333a55',55],['#4a5580',48]]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(G.wp[0].x,G.wp[0].y);for(const p of G.wp)ctx.lineTo(p.x,p.y);ctx.stroke()}
{const bx=858,by=460,pc=Math.max(0,G.lives/BASE);ctx.font='40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('🏰',bx,by);
ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx-35,by-42,70,9);ctx.fillStyle=pc>.5?'#2ecc71':pc>.25?'#f1c40f':'#e74c3c';ctx.fillRect(bx-35,by-42,70*pc,9);
ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(bx-35,by-42,70,9);ctx.font='bold 10px sans-serif';ctx.fillStyle='#fff';ctx.fillText(G.lives+'/'+BASE,bx,by-48)}
const sp=G.pl.find(x=>x.pid===G.selP);
if(sp){const s=stats(sp.i);ctx.beginPath();ctx.arc(sp.x,sp.y,s.rng,0,6.283);ctx.fillStyle='rgba(241,196,15,.08)';ctx.fill();ctx.strokeStyle='rgba(241,196,15,.5)';ctx.lineWidth=2;ctx.stroke()}
for(const u of G.pl){const r={...R[u.i.rar]},hi=isHi(u.i),t=performance.now()/1000;if(hi)r.c=tc(u);
if(hi){sigil(u,r.c);aura(u,r.c)}
ctx.beginPath();ctx.arc(u.x,u.y,18,0,6.283);ctx.fillStyle='#0a0e27';ctx.fill();ctx.strokeStyle=r.c;ctx.lineWidth=3;
if(hi){ctx.shadowColor=r.c;ctx.shadowBlur=10}ctx.stroke();ctx.shadowBlur=0;
if(hi){ctx.save();ctx.translate(u.x,u.y);ctx.rotate(t*1.2);ctx.strokeStyle=r.c;ctx.lineWidth=2.5;ctx.shadowColor=r.c;ctx.shadowBlur=8;
ctx.beginPath();ctx.arc(0,0,26,0,1.9);ctx.stroke();ctx.beginPath();ctx.arc(0,0,26,Math.PI,Math.PI+1.9);ctx.stroke();ctx.restore();
const pu=u.pulse%2;if(pu<.6){const a=1-pu/.6;ctx.beginPath();ctx.arc(u.x,u.y,18+(1-a)*22,0,6.283);ctx.globalAlpha=a*.6;ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}}
ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(DEF[u.i.id].icon,u.x,u.y+1);
ctx.font='bold 11px sans-serif';ctx.fillStyle='#f1c40f';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText('Lv'+u.i.lv,u.x,u.y+28);ctx.fillText('Lv'+u.i.lv,u.x,u.y+28);
if(G.selP===u.pid){ctx.beginPath();ctx.arc(u.x,u.y,22,0,6.283);ctx.strokeStyle='#f1c40f';ctx.lineWidth=2;ctx.stroke()}}
for(const e of G.en){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.283);ctx.fillStyle=e.hf>0?'#fff':e.c;ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
if(e.sl>0){ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,6.283);ctx.strokeStyle='#6cf';ctx.stroke()}
const w=e.r*3,hy=e.y-e.r-10,p=Math.max(0,e.hp/e.mx);ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(e.x-w/2,hy,w,5);ctx.fillStyle=p>.5?'#2ecc71':p>.25?'#f1c40f':'#e74c3c';ctx.fillRect(e.x-w/2,hy,w*p,5);
if(e.t==='boss'){ctx.font='16px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('👑',e.x,e.y-e.r-18)}}
if(G.dim>0){ctx.fillStyle='rgba(0,0,0,'+Math.min(.5,G.dim*.5)+')';ctx.fillRect(-30,-30,960,610)}
for(const p of G.bm){const a=p.l/p.m;ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';
const path=()=>{ctx.beginPath();if(p.pts){ctx.moveTo(p.pts[0].x,p.pts[0].y);for(const q of p.pts)ctx.lineTo(q.x,q.y)}else{ctx.moveTo(p.x1,p.y1);ctx.lineTo(p.x2,p.y2)}};
ctx.globalAlpha=a;ctx.shadowColor=p.c;ctx.shadowBlur=14;path();ctx.strokeStyle=p.c;ctx.lineWidth=p.w;ctx.stroke();ctx.shadowBlur=0;path();ctx.strokeStyle='#fff';ctx.lineWidth=p.w*.4;ctx.globalAlpha=a*.9;ctx.stroke();ctx.restore()}
for(const e of G.fx){const a=e.l/e.m;
if(e.t==='exp'){ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-a*.5),0,6.283);ctx.fillStyle=`rgba(255,100,0,${a*.4})`;ctx.fill();ctx.strokeStyle=`rgba(255,200,0,${a})`;ctx.lineWidth=3;ctx.stroke()}
else if(e.t==='text'){ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillStyle=e.c;ctx.globalAlpha=a;ctx.fillText(e.s,e.x,e.y-(1-a)*20);ctx.globalAlpha=1}
else if(e.t==='ring'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.strokeStyle=e.c;ctx.lineWidth=e.w*a+1;ctx.shadowColor=e.c;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(.15+(1-a)*.85),0,6.283);ctx.stroke();ctx.restore()}
else if(e.t==='nova'){const r=e.r*(.3+(1-a)*.7),g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,r);g.addColorStop(0,'#fff');g.addColorStop(.35,e.c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*.8;ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,r,0,6.283);ctx.fill();ctx.restore()}
else if(e.t==='slash'){const L=30*(.5+(1-a));ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.lineCap='round';ctx.strokeStyle=e.c;ctx.lineWidth=4*a+1;ctx.shadowColor=e.c;ctx.shadowBlur=14;
for(const o of[0,1.3]){const an=e.a+o;ctx.beginPath();ctx.moveTo(e.x-Math.cos(an)*L,e.y-Math.sin(an)*L);ctx.lineTo(e.x+Math.cos(an)*L,e.y+Math.sin(an)*L);ctx.stroke()}ctx.restore()}
else if(e.t==='banner'){ctx.save();ctx.globalAlpha=Math.min(1,a*2);ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.shadowColor=e.c;ctx.shadowBlur=25;ctx.strokeStyle=e.c;ctx.lineWidth=4;ctx.fillStyle='#fff';const y=110-(1-a)*12;ctx.strokeText(e.s,450,y);ctx.fillText(e.s,450,y);ctx.restore()}}
for(const p of G.par){const a=p.l/p.m;ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.z*a,0,6.283);ctx.fill()}ctx.globalAlpha=1;
if(G.cd>0){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,900,550);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f1c40f';ctx.font='bold 90px sans-serif';ctx.fillText(Math.ceil(G.cd),450,255);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('Bersiap! Tempatkan unit...',450,330);ctx.fillStyle='#aaa';ctx.font='14px sans-serif';ctx.fillText('Taruh unit → wave 1 langsung mulai',450,360)}
ctx.restore();
if(G.flash>0){ctx.fillStyle=G.fc;ctx.globalAlpha=Math.min(.6,G.flash*1.2);ctx.fillRect(0,0,900,550);ctx.globalAlpha=1}}
let lt=performance.now();
function loop(n){const dt=Math.min((n-lt)/1000,.1);lt=n;if(G&&$('game').classList.contains('on')){update(dt);if(G)draw()}requestAnimationFrame(loop)}
updMenu();requestAnimationFrame(loop);
</script></body></html>
