<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tower Defense Sederhana</title>
<style>
  body { margin:0; display:flex; flex-direction:column; align-items:center; background:#222; color:#fff; font-family:sans-serif; }
  canvas { background:#111; border:2px solid #444; margin-top:10px; }
  #ui { margin:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { padding:8px 16px; font-size:16px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>
<div id="ui">
  <span>Gold: <b id="gold">100</b></span>
  <span>Lives: <b id="lives">20</b></span>
  <span>Wave: <b id="wave">0</b>/5</span>
  <button id="startWaveBtn">Mulai Wave</button>
  <span id="message"></span>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const goldEl = document.getElementById('gold');
const livesEl = document.getElementById('lives');
const waveEl = document.getElementById('wave');
const messageEl = document.getElementById('message');
const startWaveBtn = document.getElementById('startWaveBtn');

const TOWER_COST = 50;
const TOWER_RANGE = 100;
const TOWER_DAMAGE = 10;
const TOWER_COOLDOWN = 0.5;

let gold = 100;
let lives = 20;
let wave = 0;
let gameOver = false;
let win = false;

const waypoints = [
  {x:0, y:300},
  {x:200, y:300},
  {x:200, y:100},
  {x:500, y:100},
  {x:500, y:500},
  {x:800, y:500}
];

let enemies = [];
let towers = [];
let beams = [];
let waveActive = false;
let spawnTimer = 0;
let spawnedCount = 0;
let currentWaveDef = null;

const waves = [
  { count: 5, interval: 1.0, type: 'normal' },
  { count: 8, interval: 0.8, type: 'normal' },
  { count: 6, interval: 1.0, type: 'fast' },
  { count: 5, interval: 1.2, type: 'normal' },
  { count: 3, interval: 1.5, type: 'tank' }
];

const enemyTypes = {
  normal: { hp: 30, speed: 60, reward: 10, color: '#e74c3c', radius: 10 },
  fast: { hp: 20, speed: 100, reward: 12, color: '#f1c40f', radius: 8 },
  tank: { hp: 80, speed: 40, reward: 20, color: '#9b59b6', radius: 14 }
};

function spawnEnemy(type) {
  const def = enemyTypes[type];
  enemies.push({
    x: waypoints[0].x,
    y: waypoints[0].y,
    hp: def.hp,
    maxHp: def.hp,
    speed: def.speed,
    reward: def.reward,
    color: def.color,
    radius: def.radius,
    waypointIndex: 1
  });
}

function startWave() {
  if (gameOver || win) return;
  if (waveActive) return;
  if (wave >= waves.length) return;
  if (enemies.length > 0) return;
  wave++;
  currentWaveDef = waves[wave-1];
  waveActive = true;
  spawnTimer = 0;
  spawnedCount = 0;
  updateUI();
}

function updateUI() {
  goldEl.textContent = gold;
  livesEl.textContent = lives;
  waveEl.textContent = wave + '/' + waves.length;
  startWaveBtn.disabled = waveActive || gameOver || win || enemies.length > 0 || wave >= waves.length;
  if (gameOver) messageEl.textContent = 'Game Over!';
  else if (win) messageEl.textContent = 'Menang!';
  else if (waveActive) messageEl.textContent = 'Wave berlangsung...';
  else if (enemies.length > 0) messageEl.textContent = 'Bersihkan musuh dulu.';
  else if (wave >= waves.length) messageEl.textContent = 'Semua wave selesai!';
  else messageEl.textContent = 'Klik canvas untuk pasang tower.';
}

function distance(x1,y1,x2,y2) {
  return Math.hypot(x2-x1, y2-y1);
}

function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return distance(px,py,x1,y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const projX = x1 + t * dx;
  const projY = y1 + t * dy;
  return distance(px, py, projX, projY);
}

function isOnPath(x, y) {
  for (let i = 0; i < waypoints.length - 1; i++) {
    const d = pointToSegmentDistance(x, y, waypoints[i].x, waypoints[i].y, waypoints[i+1].x, waypoints[i+1].y);
    if (d < 30) return true;
  }
  return false;
}

function isNearTower(x, y) {
  for (const t of towers) {
    if (distance(x, y, t.x, t.y) < 40) return true;
  }
  return false;
}

canvas.addEventListener('click', (e) => {
  if (gameOver || win) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (gold < TOWER_COST) {
    messageEl.textContent = 'Gold tidak cukup!';
    return;
  }
  if (isOnPath(x, y)) {
    messageEl.textContent = 'Tidak bisa pasang di jalan!';
    return;
  }
  if (isNearTower(x, y)) {
    messageEl.textContent = 'Terlalu dekat dengan tower lain!';
    return;
  }
  gold -= TOWER_COST;
  towers.push({
    x, y,
    range: TOWER_RANGE,
    damage: TOWER_DAMAGE,
    cooldown: TOWER_COOLDOWN,
    cooldownTimer: 0
  });
  updateUI();
  messageEl.textContent = 'Tower dipasang!';
});

startWaveBtn.addEventListener('click', startWave);

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (gameOver || win) return;

  if (waveActive) {
    spawnTimer += dt;
    if (spawnedCount < currentWaveDef.count && spawnTimer >= currentWaveDef.interval) {
      spawnEnemy(currentWaveDef.type);
      spawnedCount++;
      spawnTimer = 0;
    }
    if (spawnedCount >= currentWaveDef.count) {
      waveActive = false;
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const target = waypoints[enemy.waypointIndex];
    if (!target) {
      lives--;
      enemies.splice(i, 1);
      if (lives <= 0) {
        lives = 0;
        gameOver = true;
        updateUI();
        return;
      }
      continue;
    }
    const dx = target.x - enemy.x;
    const dy = target.y - enemy.y;
    const dist = Math.hypot(dx, dy);
    const move = enemy.speed * dt;
    if (dist <= move) {
      enemy.x = target.x;
      enemy.y = target.y;
      enemy.waypointIndex++;
    } else {
      enemy.x += (dx / dist) * move;
      enemy.y += (dy / dist) * move;
    }
  }

  for (const tower of towers) {
    tower.cooldownTimer -= dt;
    if (tower.cooldownTimer <= 0) {
      let target = null;
      let minDist = Infinity;
      for (const enemy of enemies) {
        const d = distance(tower.x, tower.y, enemy.x, enemy.y);
        if (d <= tower.range && d < minDist) {
          minDist = d;
          target = enemy;
        }
      }
      if (target) {
        target.hp -= tower.damage;
        tower.cooldownTimer = tower.cooldown;
        beams.push({ x1: tower.x, y1: tower.y, x2: target.x, y2: target.y, life: 0.1 });
        if (target.hp <= 0) {
          gold += target.reward;
          const idx = enemies.indexOf(target);
          if (idx !== -1) enemies.splice(idx, 1);
          updateUI();
        }
      }
    }
  }

  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }

  if (!waveActive && enemies.length === 0 && wave >= waves.length && !gameOver) {
    win = true;
    updateUI();
  }

  updateUI();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#555';
  ctx.lineWidth = 40;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(waypoints[0].x, waypoints[0].y);
  for (let i = 1; i < waypoints.length; i++) {
    ctx.lineTo(waypoints[i].x, waypoints[i].y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(waypoints[0].x, waypoints[0].y);
  for (let i = 1; i < waypoints.length; i++) {
    ctx.lineTo(waypoints[i].x, waypoints[i].y);
  }
  ctx.stroke();

  for (const tower of towers) {
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#3498db';
    ctx.fill();
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 3;
    ctx.stroke();

    if (tower.cooldownTimer > 0) {
      ctx.beginPath();
      ctx.arc(tower.x, tower.y, 18, -Math.PI/2, -Math.PI/2 + (1 - tower.cooldownTimer / tower.cooldown) * Math.PI * 2);
      ctx.strokeStyle = '#2ecc71';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  for (const enemy of enemies) {
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
    ctx.fillStyle = enemy.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    const hpWidth = 30;
    const hpHeight = 4;
    const hpX = enemy.x - hpWidth/2;
    const hpY = enemy.y - enemy.radius - 8;
    ctx.fillStyle = '#000';
    ctx.fillRect(hpX, hpY, hpWidth, hpHeight);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(hpX, hpY, hpWidth * (enemy.hp / enemy.maxHp), hpHeight);
  }

  for (const beam of beams) {
    ctx.beginPath();
    ctx.moveTo(beam.x1, beam.y1);
    ctx.lineTo(beam.x2, beam.y2);
    ctx.strokeStyle = `rgba(255, 255, 0, ${beam.life / 0.1})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  if (gameOver || win) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(gameOver ? 'GAME OVER' : 'MENANG!', canvas.width/2, canvas.height/2);
    ctx.font = '24px sans-serif';
    ctx.fillText('Refresh untuk main lagi', canvas.width/2, canvas.height/2 + 50);
  }
}

updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
