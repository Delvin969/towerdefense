function summon(n){
if(S.gems<100*n)return;
S.gems-=100*n;
const got=[],soldNames={};let soldCount=0,soldGems=0;
for(let i=0;i<n;i++){
let x=Math.random(),a=0,r='common';
for(const k of['common','rare','epic','legendary','mythic','td','eternal']){a+=R[k].p;if(x<a){r=k;break}}
const p=POOL[r],d=p[Math.floor(Math.random()*p.length)];
const dup=S.inv.some(u=>u.id===d[0]);
if(dup){S.gems+=25;soldCount++;soldGems+=25;soldNames[d[0]]=(soldNames[d[0]]||0)+1;continue}
const u={iid:S.nid++,id:d[0],rar:r,lv:1,trait:null};S.inv.push(u);got.push(u);}
let msg='';
if(got.length){got.sort((a,b)=>ORD.indexOf(a.rar)-ORD.indexOf(b.rar));const best=got[0];msg=`${DEF[best.id].icon} ${DEF[best.id].name} (${R[best.rar].n})!`;if(got.length>1)msg=`✨ ${got.length} unit baru! Terbaik: `+msg}
if(soldCount>0){const soldList=Object.keys(soldNames).map(id=>`${DEF[id].icon}${DEF[id].name}×${soldNames[id]}`).join(' ');msg+=(msg?' · ':'')+`♻️ Duplikat: ${soldList} (+${soldGems}💎)`}
if(!msg)msg='Tidak ada unit baru.';
toast(msg);
let bestUnit=null;
for(const u of got){if(RAR_TRIGGER.includes(u.rar)){if(!bestUnit||RAR_ORDER.indexOf(u.rar)>RAR_ORDER.indexOf(bestUnit.rar))bestUnit=u}}
if(bestUnit){playSummonCinematic(bestUnit,()=>{updMenu();save()})}
else{updMenu();save()}}

function update(dt){
if(!G||G.paused||G.over)return;
if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;if(G.dim>0)G.dim-=dt;
if(G.cd>0){G.cd-=dt;if(G.cd<=0){G.cd=0;startWave()}}
if(G.nx>0){G.nx-=dt;if(G.nx<=0){G.nx=0;startWave()}}
if(G.act){G.we+=dt;if(!G.skipped&&G.we>=30){if(S.auto){while(G.q.length)spawn(G.q.shift());G.skipped=true;toast('⏩ Auto-skip!')}else $('sk').style.display='inline-block'}
if(G.q.length){G.qt+=dt;const iv=G.inf?(G.wave%10===0?.4:.35):(G.wave===MAXW?.4:.35);if(G.qt>=iv){G.qt=0;spawn(G.q.shift())}}}
for(const e of G.en){if(e.dead)continue;
if(e.sl>0){e.sl-=dt;if(e.sl<=0)e.sf=1}if(e.hf>0)e.hf-=dt;
const t=G.wp[e.wi];
if(!t){e.dead=true;const boss=e.t==='boss';
if(boss){if(G.inf){const dmg=DMG*10;G.lives=Math.max(0,G.lives-dmg);shake(15,.4);flash('#f00',.5);ftext(850,420,'💀 BOSS -'+dmg,'#f33',1.2)}
else{G.lives=0;shake(22,.6);flash('#f00',.6);ftext(850,420,'💀 BOSS MASUK!','#f33',1.2)}}
else{G.lives=Math.max(0,G.lives-DMG);shake(8,.3);flash('#f00',.2);ftext(850,420,'-'+DMG,'#f33',1.2)}
if(G.lives<=0){G.over=true;defeat(boss);return}continue}
const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy),mv=e.sp*e.sf*dt;
if(d<=mv){e.x=t.x;e.y=t.y;e.wi++}else{e.x+=dx/d*mv;e.y+=dy/d*mv}}
for(const u of G.pl){const st=stats(u.i);u.cdT-=dt;
if(S.fx&&isHi(u.i)&&Math.random()<dt*8)G.par.push({x:u.x+(Math.random()-.5)*30,y:u.y+12,vx:(Math.random()-.5)*10,vy:-40-Math.random()*30,l:1,m:1,c:tc(u),z:2.5});
u.pulse+=dt;if(u.buff>0)u.buff-=dt;
if(u.ultCd>0)u.ultCd=Math.max(0,u.ultCd-dt);
if(u.cdT<=0){let t=null,md=1e9;for(const e of G.en){if(e.dead)continue;const d=Math.hypot(u.x-e.x,u.y-e.y);if(d<=st.rng&&d<md){md=d;t=e}}
if(t){u.aimAngle=Math.atan2(t.y-u.y,t.x-u.x);fire(u,st,t);u.cdT=st.cd}}}
G.en=G.en.filter(e=>!e.dead);
if(G.act&&!G.q.length&&!G.en.length){G.act=false;let ec=0;
for(const u of G.pl)if(DEF[u.i.id].skill==='economy'){const rarK=ECO_K[u.i.rar]||1.0;const r=Math.floor((80+u.i.lv*35)*rarK);ec+=r;ftext(u.x,u.y-30,'+'+r+'🪙','#f1c40f',1.2)}
const bonus=G.inf?Math.floor(250*(1+G.wave*.05)):250;
S.coins+=bonus+ec;$('sk').style.display='none';
if(!G.inf&&G.wave>=MAXW)victory();else{toast(`🌊 Wave ${G.wave} selesai! +${bonus+ec} 🪙`);G.nx=2}
ui()}
for(const a of[G.par,G.bm,G.fx])for(let i=a.length-1;i>=0;i--){a[i].l-=dt;if(a[i].l<=0)a.splice(i,1)}
for(const p of G.par){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94}
ui(true)}

{const bx=858,by=460,pc=Math.max(0,G.lives/BASE);ctx.font='40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('🏰',bx,by);

else if(e.t==='slash'){const L=30*(.5+(1-a));ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.lineCap='round';ctx.strokeStyle=e.c;ctx.lineWidth=4*a+1;ctx.shadowColor=e.c;ctx.shadowBlur=14;
